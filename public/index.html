<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paperbreak — surf, quietly</title>
<meta name="description" content="A quiet, paper-style surf forecast: cams, rewind, tides, wind and swell for every Surfline spot.">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Theme boot before first paint (no flash).
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('pb:settings') || '{}');
      var t = s.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header class="topbar" id="topbar">
  <a class="wordmark" href="#/" aria-label="Paperbreak home">
    <svg class="wordmark-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c3-6 6-6 9 0s6 6 9 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Paperbreak</span>
  </a>
  <nav class="topnav">
    <button class="iconbtn" id="nav-search" aria-label="Search spots" title="Search ( / )">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
    </button>
    <a class="iconbtn" href="#/map" aria-label="Map of all spots" title="Map (m)">
      <svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
    </a>
    <button class="iconbtn" id="nav-theme" aria-label="Toggle theme" title="Theme (t)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
    </button>
    <button class="iconbtn" id="nav-settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="1.8" class="fill"/><circle cx="15" cy="12" r="1.8" class="fill"/><circle cx="7" cy="17" r="1.8" class="fill"/></svg>
    </button>
  </nav>
</header>

<div class="offline-note" id="offline-note" hidden></div>

<main id="view" class="view" tabindex="-1"></main>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
